name: StreamX Media3 Pro v12.5 Ultra-Zap 3D 512MB APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP Automatically
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z"
          done
          for z in *v12.5*.zip *Ultra_Zap*.zip *3D*.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
            fi
          done
          if [ -d "iptv_media3_pro_android_tv" ]; then
            cp -rf iptv_media3_pro_android_tv/. .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Project Structure
        run: python3 scripts/verify_project.py

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Compile Debug & Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload Ready APKs
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Media3-Pro-v12.5-UltraZap3D-512MB-APKs
          path: app/build/outputs/apk/**/*.apk
          
